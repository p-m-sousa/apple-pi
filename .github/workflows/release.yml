name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v (for example, 0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Secret-free release preflight
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify runner and pinned generator
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version
          ./script/xcodegen.sh --version

      - name: Validate repository scaffolding
        run: |
          bash -n script/*.sh
          plutil -lint ApplePi/Resources/Info.plist
          plutil -lint ApplePi/Resources/ApplePi.entitlements
          ./script/test_release_guardrails.sh
          ./script/xcodegen.sh generate
          git diff --exit-code -- ApplePi.xcodeproj/project.pbxproj ApplePi.xcodeproj/xcshareddata

      - name: Resolve pinned Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ApplePi.xcodeproj \
            -scheme ApplePi \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -skipPackagePluginValidation

      - name: Run full unit and UI test suite
        run: |
          # macOS XCUI runners must remain eligible for Xcode's local ad-hoc signing.
          xcodebuild \
            -project ApplePi.xcodeproj \
            -scheme ApplePi \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath .build/DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -skipPackagePluginValidation \
            test

      - name: Analyze first-party code
        run: |
          xcodebuild \
            -project ApplePi.xcodeproj \
            -scheme ApplePi \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath .build/DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Validate size-optimized release build
        run: |
          xcodebuild \
            -project ApplePi.xcodeproj \
            -scheme ApplePi \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath .build/DerivedData-Release \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            ENABLE_CODE_COVERAGE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          host_app_kib="$(du -sk .build/DerivedData-Release/Build/Products/Release/ApplePi.app | awk '{print $1}')"
          host_app_bytes="$((host_app_kib * 1024))"
          test "$host_app_bytes" -le 15728640
          test ! -e .build/DerivedData-Release/Build/Products/Release/ApplePi.app/Contents/Resources/PiRuntime
          echo "Host app size: $host_app_bytes bytes (budget: 15728640)"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ApplePi-release-preflight-xcresult
          path: .build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Sign, notarize, and package
    needs: preflight
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must have three numeric components, such as 0.1.0: $version" >&2
            exit 64
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"

      - name: Verify runner and pinned generator
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          ./script/xcodegen.sh --version

      - name: Validate release secrets
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=()
          [[ -n "$CERTIFICATE_P12_BASE64" ]] || missing+=(DEVELOPER_ID_CERTIFICATE_P12_BASE64)
          [[ -n "$CERTIFICATE_PASSWORD" ]] || missing+=(DEVELOPER_ID_CERTIFICATE_PASSWORD)
          [[ -n "$SIGNING_IDENTITY" ]] || missing+=(DEVELOPER_ID_APPLICATION_IDENTITY)
          [[ -n "$PRIVATE_KEY_BASE64" ]] || missing+=(APPLE_API_PRIVATE_KEY_BASE64)
          [[ -n "$API_KEY_ID" ]] || missing+=(APPLE_API_KEY_ID)
          [[ -n "$API_ISSUER_ID" ]] || missing+=(APPLE_API_ISSUER_ID)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing release environment secret: %s\n' "${missing[@]}" >&2
            exit 64
          fi
          if [[ "$SIGNING_IDENTITY" != "Developer ID Application:"* ]]; then
            echo "DEVELOPER_ID_APPLICATION_IDENTITY must name a Developer ID Application identity." >&2
            exit 64
          fi

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          umask 077
          certificate_path="$RUNNER_TEMP/apple-pi-developer-id.p12"
          keychain_path="$RUNNER_TEMP/apple-pi-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D >"$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          printf '%s\n' "$identities"
          if [[ "$identities" != *"\"$SIGNING_IDENTITY\""* ]]; then
            echo "Imported keychain does not contain the configured Developer ID identity." >&2
            exit 67
          fi
          echo "APPLE_PI_RELEASE_KEYCHAIN=$keychain_path" >>"$GITHUB_ENV"

      - name: Materialize notarization API key
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          printf '%s' "$PRIVATE_KEY_BASE64" | /usr/bin/base64 -D >"$key_path"
          chmod 600 "$key_path"
          echo "APPLE_PI_NOTARY_KEY=$key_path" >>"$GITHUB_ENV"

      - name: Build release artifacts
        env:
          APPLE_PI_VERSION: ${{ steps.version.outputs.version }}
          APPLE_PI_BUILD_NUMBER: ${{ github.run_number }}
          APPLE_PI_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_PI_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_PI_NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./script/package_release.sh

      - name: Verify release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS
          test -s "ApplePi-$VERSION.dmg"
          test -s "ApplePi-$VERSION.zip"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ApplePi-${{ steps.version.outputs.version }}
          path: |
            dist/ApplePi-${{ steps.version.outputs.version }}.dmg
            dist/ApplePi-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Summarize package rehearsal
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "### ApplePi $VERSION package rehearsal" >>"$GITHUB_STEP_SUMMARY"
          echo "Signed and notarized artifacts were uploaded to this workflow run; no GitHub Release was created." >>"$GITHUB_STEP_SUMMARY"

      - name: Upload notarization diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ApplePi-${{ steps.version.outputs.version }}-notarization-diagnostics
          path: dist/*-notarization-log.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -n "${APPLE_PI_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$APPLE_PI_RELEASE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP"/apple-pi-developer-id.p12
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  stage-release:
    name: Stage draft GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download signed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ApplePi-${{ needs.package.outputs.version }}
          path: dist

      - name: Verify downloaded artifacts
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test -s "ApplePi-$VERSION.dmg"
          test -s "ApplePi-$VERSION.zip"

      - name: Create or update draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          assets=(
            "dist/ApplePi-$VERSION.dmg"
            "dist/ApplePi-$VERSION.zip"
            "dist/SHA256SUMS"
          )
          if release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Refusing to replace assets on published release $RELEASE_TAG." >&2
              exit 65
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft \
              --generate-notes \
              --title "ApplePi $VERSION" \
              --verify-tag
          fi

      - name: Summarize draft release
        env:
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          echo "### $RELEASE_TAG staged as a draft" >>"$GITHUB_STEP_SUMMARY"
          echo "Install and smoke-test the downloaded DMG, then publish the draft release manually." >>"$GITHUB_STEP_SUMMARY"
