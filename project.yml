name: ApplePi

options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "26.0"
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0

settings:
  base:
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
    SUPPORTS_MACCATALYST: false
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: true
    DEAD_CODE_STRIPPING: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: true

targets:
  ApplePi:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ApplePi
        excludes:
          - Resources
      - path: ApplePi/Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - ApplePi.entitlements
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: ApplePi
        PRODUCT_MODULE_NAME: ApplePi
        PRODUCT_BUNDLE_IDENTIFIER: com.paulsousa.ApplePi
        INFOPLIST_FILE: ApplePi/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ApplePi/Resources/ApplePi.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"

  ApplePiTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ApplePiTests
        optional: true
    dependencies:
      - target: ApplePi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulsousa.ApplePiTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ApplePi.app/Contents/MacOS/ApplePi"
        BUNDLE_LOADER: "$(TEST_HOST)"

  ApplePiUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ApplePiUITests
        optional: true
    dependencies:
      - target: ApplePi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulsousa.ApplePiUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: ApplePi

schemes:
  ApplePi:
    build:
      targets:
        ApplePi: all
        ApplePiTests: [test]
        ApplePiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - ApplePi
      captureScreenshotsAutomatically: false
      deleteScreenshotsWhenEachTestSucceeds: true
      targets:
        - name: ApplePiTests
          parallelizable: false
        - name: ApplePiUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
